<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - FoodBridge</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="hidden">

  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="brand"><span class="brand-mark">🍱</span> FoodBridge</a>
    </div>
    <div class="nav-links">
      <a href="login.html" id="navDashboard">Dashboard</a>
      <a href="profile.html" class="active" id="navProfile">Profile</a>
    </div>
    <div class="nav-user">
      <span class="role-badge" id="navUserRole"></span>
      <span class="user-chip" id="navUserName"></span>
      <button id="logoutBtn" class="btn btn-outline btn-sm">Log out</button>
    </div>
  </nav>

  <div class="container">
    <div class="page-header">
      <h1>My profile</h1>
      <p>Collectors and donors see your name and phone number when food is claimed.</p>
    </div>

    <div class="profile-grid">

      <section class="panel">
        <h2>Contact details</h2>
        <p class="panel-sub">Keep your number and address up to date so pickups go smoothly.</p>

        <div id="profileMessage" class="msg"></div>

        <form id="profileForm">
          <div class="form-group">
            <label>Email address</label>
            <div class="readonly-line" id="profileEmail"></div>
          </div>
          <div class="form-group">
            <label for="profileName">Name</label>
            <input type="text" id="profileName" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="profilePhone">Mobile number</label>
            <input type="tel" id="profilePhone" class="form-control"
                   pattern="01[3-9][0-9]{8}" minlength="11" maxlength="11" inputmode="numeric" title="Exactly 11 digits starting with 01, e.g. 01711223344" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="profileArea">Area</label>
              <select id="profileArea" class="form-control" required>
                <option value="">Select your area</option>
              </select>
            </div>
            <div class="form-group">
              <label for="profileAddress">Address</label>
              <input type="text" id="profileAddress" class="form-control" required>
            </div>
          </div>
          <button type="submit" id="saveProfileBtn" class="btn btn-primary">Save changes</button>
        </form>
      </section>

      <section class="panel">
        <h2>Change password</h2>
        <p class="panel-sub">Use at least 6 characters.</p>

        <div id="passwordMessage" class="msg"></div>

        <form id="passwordForm">
          <div class="form-group">
            <label for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" class="form-control" autocomplete="current-password" required>
          </div>
          <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" class="form-control" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="confirmNewPassword">Confirm new password</label>
            <input type="password" id="confirmNewPassword" class="form-control" autocomplete="new-password" required>
          </div>
          <button type="submit" id="changePasswordBtn" class="btn btn-accent">Change password</button>
        </form>
      </section>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
